<html>  
    <head>
                <style>
        * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: sans-serif;
        }

        body {
        background-color: #fef2f5;
        text-align: center  ;
        }

        .topbar {
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        background-color: #da9494; 
        padding: 10px 20px;
        color: #fff;
        position: sticky; 
        top: 0;
        z-index: 1000;
        }

        .logo {
        font-size: 24px;
        font-weight: bold;
        text-decoration: none;
        color: #fff;
        }
        .piclogo {
        height: 40px; 
        weight: auto;
        }

        .nav-links {
        display: flex; 
        list-style: none; 
        }

        .nav-links li a {
        display: block;
        padding: 10px 15px;
        color: #fff; 
        text-decoration: none; 
        font-size: 16px;
        transition: background 0.3s;
        }

        .nav-links li a:hover {
        background-color: #555;
        border-radius: 4px;
        }

        .menu-toggle {
        display: none;
        cursor: pointer;
        flex-direction: column;
        gap: 5px;
        }

        .menu-toggle span {
        background-color: #fff;
        height: 3px;
        width: 25px;
        border-radius: 2px;
        }

            #checkbox-toggle {
        display: none;
        }

        .abt {
        padding: 30px;
        }

        /* .register {
        text-align: center;
        padding: 20px;
        width: 300px;
        height: 150px;
        background-color: #fef2f5;
        border: 2px solid #ccc;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        } */

        .btn {
            padding: 8px 16px;
            background-color: white;
            text-decoration: none;
            border-radius: 4px;
        }

        .pic{
            width: 50px;
            height: 50px;
        }

        footer {
        text-align: center;
        color: rgb(183, 152, 152);
        padding: 15px;
        }

        @media (max-width: 768px) {
        .menu-toggle {
            display: flex;
        }

        .nav-links {
            display: none; 
            flex-direction: column;
            width: 100%;
            position: absolute;
            top: 100%; 
            left: 0;
            background-color: #333;
            padding: 10px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .nav-links li {
            text-align: center;
        }

                .nav-links li a {
            padding: 15px;
        }

        #checkbox-toggle:checked ~ .nav-links {
            display: flex;
        }
        }

        

        </style>
    </head>
    <body>
        <nav class="topbar">
        <img src="logo.png" alt="Brand Logo" class="piclogo">
        <a href="#" class="logo">GalleryCove</a>

        <input type="checkbox" id="checkbox-toggle">
        
        <label for="checkbox-toggle" class="menu-toggle">
        <span></span>
        <span></span>
        <span></span>
        </label>

        
        <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
        </ul>
    </nav>
        <footer>

        </footer>
    </body>
</html>
