
<html>
  <head>
    <title>GalleryCove - Login</title>

    <style>
      * {
        margin: 0;             
        padding: 0;            
        box-sizing: border-box; 
        font-family: sans-serif;
      }

  
      body {
        background-color: #fef2f5;
        background-image: url('bggg2.png');
        background-repeat: no-repeat;
        background-size: cover;
        background-attachment: fixed;
        display: flex;          
        justify-content: center;  
        align-items: center;     
        min-height: 100vh;        
      }

      .formbox {
        width: 340px;                            
        padding: 28px;                             
        background-color: #fff;                    
        border-radius: 8px;                      
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);  
        text-align: center;                          
      }

      .formbox .piclogo {
        height: 40px;        
        margin-bottom: 10px;
      }

      .formbox h1 {
        color: #3d0369;
        font-size: 37px;
        margin-bottom: 6px;
      }

      .formbox p.subtitle {
        color: #8203a9;          
        font-size: 14px;
        margin-bottom: 20px;   
      }

     
      .formbox form {
        text-align: left;
        color: #47037a;
      }

      .formbox label {
        display: block;       
        margin-bottom: 6px;  
        font-size: 14px;
      }

      .formbox input[type="text"],
      .formbox input[type="password"] {
        width: 100%;                    
        padding: 10px;                  
        margin-bottom: 14px;            
        border: 1px solid #ccc;        
        border-radius: 4px;             
      }

      .checkbox-row {
        display: flex;        
        align-items: center; 
        gap: 6px;            
        margin-bottom: 14px; 
        font-size: 13px;
      }

      .formbox button {
        width: 100%;                 
        padding: 10px;              
        background-color: #51058b;   
        color: #fff;                
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;            
        margin-bottom: 12px;        
      }

      .formbox button:hover {
        background-color: #3e026b;
      }

      .formbox .links {
        text-align: center; 
        font-size: 14px;
        color: #420252;
      }

      .formbox .links a {
        color: #930cc5;       
        text-decoration: none; 
      }

      .formbox .links a:hover {
        text-decoration: underline; 
      }

      .prevpage-link {
        display: block;      
        text-align: center;
        margin-top: 10px;     
        font-size: 14px;
        color: #999;          
      }
    </style>
  </head>

  <body>

    <div class="formbox">

      
      <img src="1.png" alt="Brand Logo" class="piclogo" />

      <h1>Welcome Back</h1>
      <p class="subtitle">Log in to continue to GalleryCove</p>

     
      <form action="homepage.html">

        <label for="identifier">Email or Username</label>
        <input type="text" id="identifier" name="identifier" required />

        <label for="pass">Password</label>
        <input type="password" id="pass" name="password" required />

        <div class="checkbox-row">
          <input type="checkbox" id="remember" name="remember" />
          <label for="remember" style="margin:0;">Remember me</label>
        </div>

        <button type="submit">Login</button>
      </form>

      <div class="links">
        <p><a href="#">Forgot password?</a></p>
        <p>Don't have an account? <a href="signup.html" target="_self">Register</a></p>
      </div>

      <a href="landingpage.html" class="prevpage-link" target="_self">⬅ Go back</a>
    </div>

  </body>
</html>
